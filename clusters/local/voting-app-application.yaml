apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:simoneroselli/cluedops.git
    targetRevision: HEAD
    path: apps/base/voting-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: Service
metadata:
  name: voting-app-ui
  namespace: dev
spec:
  type: NodePort
  selector:
    app: vote
  ports:
    - name: http
      port: 8085
      targetPort: 80
      nodePort: 30085
