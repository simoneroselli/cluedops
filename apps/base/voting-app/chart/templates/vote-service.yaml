apiVersion: v1
kind: Service
metadata:
  name: '{{include "voting-app.fullname" .}}-vote'
  labels:
    app: '{{include "voting-app.name" .}}-vote'
spec:
  type: '{{.Values.service.vote.type}}'
  ports:
    - port: {{.Values.service.vote.port}}
      targetPort: 80
      name: http
  selector:
    app: '{{include "voting-app.name" .}}-vote'
